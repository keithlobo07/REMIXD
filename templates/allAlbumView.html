<html>
  <head>
    <title>REMIXD - Album View</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">-->
    <!-- Favicon -->
    <link
      rel="icon"
      href="{{ url_for('static', filename='assets/remixd-logo.png') }}"
    />
    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/allAlbumView-style.css')}}"
    />
  </head>
  <script src="{{url_for('static',filename='js/allAlbumView-java.js')}}"></script>

  <main style="height: 100%; width: 100%">
    <div class="container-fluid">
      <div class="row" style="height: 100%">
        <div class="col-md-2 col-sm-4" id="sidebar">
          <!--LOGO AND FILERS-->
          <a href="{{ url_for('pages.lander') }}"></a>
          <img
            src="{{url_for('static', filename='assets/remixd blue.png')}}"
            id="logo"
            alt="REMIXD Logo"
            class="img-fluid"
            style="max-width: 40px"
          />
          </a>
          <h2>REMIXD</h2>
          <p></p>
          <p></p>
          
        </div>
        <div class="col-md-10 col-sm-8">
            <!--SEARCH AND ALBUMS-->
            <div class="container">
                <div class="row">
                    <div class="col-11">
                        <form >
                            <input type="text" id="search" name="search" placeholder="Search..."  style="margin-top:10px; padding-left: 15px;"><br>
                        </form>
                    </div>
                    <div class="col-1">
                        <div class="dropdown" style="margin-top: 15px;">
                            <button onclick="menuDrop()" class="dropbtn" style="width: 40px; height: 40px;"></button>
                            <div id="myDropdown" class="menuContent">
                              {% if logintype == 1 %}
                                <a href="/user/{{ session['id'] }}">Profile</a>
                                <a href="{{ url_for('utils.logout') }}">Log out</a>
                              {% elif logintype == 2 %} 
                                <a href="{{ url_for('pages.admin_page') }}">Admin Dashboard</a>
                                 <a href="/user/{{ session['id'] }}">Profile</a>
                                <a href="{{ url_for('utils.logout') }}">Log out</a>
                              {% else %}
                                <a href="{{ url_for('pages.login_page') }}">Login</a>
                                <a href="{{ url_for('pages.signup_page') }}">Sign Up</a>
                              {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
                <p>
                <p>
                {% for album in albums %}
                <div class="row" style="height: auto">
                    <div class="col d-flex flex-column">
                        <!--CARD NOTE FROM ALBUM VIEW-->
                            <div class="card" id="card">
                              <a href="/album/{{album.idAlbum}}">
                                <div class="card-body">
                                    <div class = "container">
                                        <div class="row">
                                            <div class="col-3">
                                                <img id="albumCover" alt="album cover" style="width: clamp(100px, 13vw, 200px); padding :5px;" src="{{ album.coverArt }}">
                                            </div>
                                            <div class="col-9" style="padding-left: 5%;">
                                                <!--make link to the album-->
                                                <div class="row">
                                                    <div class="col-5">
                                                        <h5 id="albumTitle">{{ album.albumName }}</h5>
                                                    </div>
                                                    <div class="col-7 text-right">
                                                        <div class="starRating">
                                                          <div class="starBackground">★★★★★</div>
                                                          <div class="starYellow" style="width: {{ album.avgScore * 10 }}%;">★★★★★</div>
                                                      </div>
                                                      <span id="albumRating">{{ album.numReviews }}</span>
                                                    </div>
                                                </div>
                                                <p id="albumArtist">{{ album.artist }}  </p>
                                                <p>
                                                <p id="albumRelease">{{ album.releasedate }} </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                </a>
                            </div>
                   </div>

                </div>
                {% endfor %}
              </div>
            </div>
            <p></p>
            <p></p>
          </div>
        </div>
      </div>
    </div>
</div>
</main>
<footer>
</footer>

<script src="{{url_for('static',filename='js/allAlbumView-java.js')}}"></script>
<script src="{{url_for('static',filename='js/menu_script.js')}}"></script>
