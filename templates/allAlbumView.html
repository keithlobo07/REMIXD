<html>
  <head>
    <title>REMIXD - Album View</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">-->
    <!-- Favicon -->
    <link
      rel="icon"
      href="{{ url_for('static', filename='assets/remixd-logo.png') }}"
    />
    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/allAlbumView-style.css')}}"
    />
  </head>

  <main style="height: 100%; width: 100%">
    <div class="container-fluid">
      <div class="row" style="height: 100%">
        <div class="col-md-2 col-sm-4" id="sidebar">
          <!--LOGO AND FILERS-->
          <a href="{{ url_for('pages.lander') }}"></a>
          <img
            src="{{url_for('static', filename='assets/remixd blue.png')}}"
            id="logo"
            alt="REMIXD Logo"
            class="img-fluid"
            style="max-width: 40px"
          />
          </a>
          <h2>REMIXD</h2>
          <p></p>
          <p></p>
          <form>
            <h4>Sort By:</h4>
            <div id="container">
              <div id="row">
                <div id="col-6">
                  <br />
                  <h5>Ratings:</h5>
                </div>
                <div id="col-6">
                  <select id="dropDown">
                    <option>High to Low</option>
                    <option>Low to High</option>
                  </select>
                  <img
                    src="{{url_for('static', filename='assets/keyboard_arrow_down.png')}}"
                  />
                </div>
              </div>
              <div id="row">
                <div id="col-6">
                  <br />
                  <h5>Reviews:</h5>
                </div>
                <div id="col-6">
                  <select id="dropDown">
                    <option>High to Low</option>
                    <option>Low to High</option>
                  </select>
                  <img
                    src="{{url_for('static', filename='assets/keyboard_arrow_down.png')}}"
                  />
                </div>
              </div>
            </div>
            <br />
            <br />
            <h4>Filter By:</h4>
            <h6>Rating:</h6>
            <input
              type="number"
              id="ratingFilter"
              name="ratingFilter"
              min="0"
              max="5"
            />
            <br />
            <h6>Review Date</h6>
            <input type="date" id="reviewDate" name="reviewDate" />
          </form>
        </div>
        <div class="col-md-10 col-sm-8">
            <!--SEARCH AND ALBUMS-->
            <div class="container">
                <div class="row">
                    <div class="col-11">
                        <form >
                            <input type="text" id="search" name="search" placeholder="Search..."  style="margin-top:10px; padding-left: 15px;"><br>
                        </form>
                    </div>
                    <div class="col-1">
                        <div class="dropdown" style="margin-top: 15px;">
                            <button onclick="menuDrop()" class="dropbtn" style="width: 40px; height: 40px;"></button>
                            <div id="myDropdown" class="menuContent">
                                <a href="{{ url_for('pages.login_page') }}">Login</a>
                                <a href="{{ url_for('pages.signup_page') }}">Sign Up</a>
                            </div>
                        </div>
                    </div>
                </div>
                <p>
                <p>
                <div class="row" style="height: auto">
                    <div class="col d-flex flex-column">
                      <div id="albumList"></div>
                   </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>
</main>
<footer>
  <script type="module" src="/static/js/pages/allAlbumView.js"></script>
  <script src="{{url_for('static',filename='js/allAlbumView-java.js')}}"></script>
</footer>
