<HTML>
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{url_for('static', filename='css/general.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/allAlbumView-style.css')}}">
    <link rel="icon" href="{{url_for('static', filename='assets/remixd-logo.png')}}">
    <title>REMIXD - Albumn View</title>
</head>

<main style="height:100%; width: 100%">
<div class="container-fluid">
    <div class="row" style="height:100%;">
        <div class="col-md-2 col-sm-4" id="sidebar">
            <!--LOGO AND FILERS-->
            <img src="{{url_for('static', filename='assets/remixd blue.png')}}" id="logo" alt="REMIXD Logo" class="img-fluid" style="max-width: 40px">
            <h2>REMIXD</h2>
            <p>
            <p>
            <form>
                <h4>Sort By:</h4>
                <div id="container">
                    <div id="row">
                        <div id="col-6">
                            <br>
                            <h5>Ratings: </h5>
                        </div>
                        <div id="col-6">
                            <select id="dropDown">
                                <option>High to Low</option>
                                <option>Low to High</option>
                            </select>
                            <img src="{{url_for('static', filename='assets/keyboard_arrow_down.png')}}">
                        </div>
                    </div>
                    <div id="row">
                        <div id="col-6">
                            <br>
                            <h5>Reviews: </h5>
                        </div>
                        <div id="col-6">
                            <select id="dropDown">
                                <option>High to Low</option>
                                <option>Low to High</option>
                            </select>
                            <img src="{{url_for('static', filename='assets/keyboard_arrow_down.png')}}">
                        </div>
                    </div>
                </div>
                <br>
                <br>
                <h4>Filter By:</h4>
                    <h6>Rating:</h6>
                    <input type="number" id="ratingFilter" name="ratingFilter" min="0" max="5">
                    <br>
                    <h6>Review Date</h6>
                    <input type="date" id="reviewDate" name="reviewDate">
            </form>        
        </div>
        <div class="col-md-10 col-sm-8">
            <!--SEARCH AND ALBUMS-->
            <div class="container">
                <div class="row">
                    <div class="col-11">
                        <form>
                            <input type="text" id="search" name="search" placeholder="Search..." style="margin-top:10px; padding-left: 15px;"><br>
                        </form>
                    </div>
                    <div class="col-1">
                        <div class="dropdown" style="margin-top: 15px;">
                            <button onclick="menuDrop()" class="dropbtn" style="width: 40px; height: 40px;"></button>
                            <div id="myDropdown" class="menuContent">
                                <a href="">Login</a>
                                <a href="">Sign Up</a>
                            </div>
                        </div>
                    </div>
                </div>
                <p>
                <p>
                <div class="row" style="height: auto">
                    <div class="col d-flex flex-column">
                        <!--CARD NOTE FROM ALBUM VIEW-->
                            <div class="card" id="card">
                                <div class="card-body">
                                    <div class = "container">
                                        <div class="row">
                                            <div class="col-3">
                                                <img id="albumCover" alt="album cover" style="width: clamp(100px, 13vw, 200px); padding :5px;">
                                            </div>
                                            <div class="col-9" style="padding-left: 5%;">
                                                <!--make link to the album-->
                                                <div class="row">
                                                    <div class="col-5">
                                                        <h5 id="albumTitle"></h5>
                                                    </div>
                                                    <div class="col-7 text-right">
                                                        <div class="starYellow" id="filledStars">★★★★★</div>
                                                        <span id="albumRating"></span>           
                                                    </div>
                                                </div>
                                                <p id="albumArtist"></p>
                                                <p>
                                                <p id="albumRelease"></p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                   </div>
                </div>
            </div>
        </div>
    </div>
</div>
</main>
<footer>
</footer>
<script src="{{url_for('static',filename='js/allAlbumView-java.js')}}"></script>
